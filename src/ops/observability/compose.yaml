name: schakker-observability
# Host networking preserves loopback isolation for host-run Go processes.
# Linux: supported natively. Docker Desktop: enable host networking (4.34+).
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    network_mode: host
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo, loki]
  tempo:
    image: grafana/tempo:2.10.3
    network_mode: host
    command: ['-config.file=/etc/tempo/config.yaml', '-config.expand-env=true']
    environment:
      TEMPO_DATA_DIR: /var/tempo
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
  loki:
    image: grafana/loki:3.7.10
    network_mode: host
    command: ['-config.file=/etc/loki/config.yaml', '-config.expand-env=true']
    environment:
      LOKI_DATA_DIR: /loki
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
  prometheus:
    image: prom/prometheus:v3.16.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=127.0.0.1:9090
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.3.1
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3030'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets: [grafana_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
secrets:
  grafana_password:
    file: ./secrets/grafana_password
volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
