apiVersion: 1
prune: true
datasources:
  - name: Prometheus
    uid: schakker-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: schakker-tempo
  - name: Tempo
    uid: schakker-tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: schakker-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{$${__tags}} | trace_id = "$${__span.traceId}"'
        tags:
          - key: service.name
            value: service_name
  - name: Loki
    uid: schakker-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: schakker-tempo
          url: '$${__value.raw}'
