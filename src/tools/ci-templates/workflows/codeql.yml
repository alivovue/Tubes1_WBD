# Inactive template: GitHub Actions only discovers .github/workflows files.
name: CodeQL security scanning
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache-dependency-path: |
            src/shared/backend/go.sum
            src/apps/user/go.sum
            src/apps/admin/go.sum
            src/tests/go.sum
            src/tools/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./tools/ci-templates/codeql/config.yml
      - name: Build every Go workspace module, including the worker
        if: matrix.language == 'go'
        shell: bash
        run: bash src/tools/codeql-build.sh
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 30
